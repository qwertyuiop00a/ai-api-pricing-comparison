name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  links-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Attribution and prompt data check
        run: python3 tools/check_links.py
